<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="A personal photo journal.">
    <title>Bill Lynch's Photoblog</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <header class="site-header">
      <a class="wordmark" href="./">Bill Lynch's Photoblog</a>
      <span class="header-note">A personal photo journal</span>
    </header>

    <main>
      <section class="intro" aria-labelledby="page-title">
        <p class="eyebrow">A collection of moments</p>
        <h1 id="page-title">The world as I find it.</h1>
        <p class="intro-copy">A place for photographs, small discoveries, and the stories in between.</p>
      </section>

      <section class="journal" aria-labelledby="journal-title">
        <div class="section-heading">
          <h2 id="journal-title">The journal</h2>
          <span>01 / Ongoing</span>
        </div>
        <a class="story-link" href="first-slideshow/">
          <span class="story-link-copy">
            <span class="eyebrow">Photo story 01</span>
            <span class="story-link-title">Mid-Oectober 2026</span>
            <span class="story-link-hint">Top 10 moments, one frame at a time.</span>
          </span>
          <span class="story-link-arrow" aria-hidden="true">↗</span>
        </a>
      </section>
    </main>

    <footer class="site-footer">
      <span>Made to remember.</span>
      <span>© <span id="year">2026</span></span>
    </footer>
  </body>
</html>
