<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="The first photo slideshow.">
    <title>The First Slideshow — Photoblog</title>
    <link rel="stylesheet" href="../styles.css">
    <script src="../slideshow.js" defer></script>
  </head>
  <body>
    <header class="site-header">
      <a class="wordmark" href="../">Photoblog</a>
      <span class="header-note">A personal photo journal</span>
    </header>

    <main>
      <section class="intro slideshow-intro" aria-labelledby="page-title">
        <p class="eyebrow">Photo story 01</p>
        <h1 id="page-title">Mid-October 2026 Top 10</h1>
        <p class="intro-copy">A collection of moments, one frame at a time.</p>
        <a class="back-link" href="../">← Back to the journal</a>
      </section>

      <section class="journal" aria-label="First photo slideshow">
        <div class="slideshow" data-slideshow role="region" aria-roledescription="carousel" aria-label="The first slideshow" hidden>
          <div class="slides">
            <figure class="slide">
              <img src="../photos/first-slideshow/20261014_0047.jpeg" alt="Photograph 20261014_0047">
            </figure>
            <figure class="slide">
              <img src="../photos/first-slideshow/20261014_0048.jpeg" alt="Photograph 20261014_0048">
            </figure>
            <figure class="slide">
              <img src="../photos/first-slideshow/20261017_0046.jpeg" alt="Photograph 20261017_0046">
            </figure>
            <figure class="slide">
              <img src="../photos/first-slideshow/20261018_0004.jpeg" alt="Photograph 20261018_0004">
            </figure>
            <figure class="slide">
              <img src="../photos/first-slideshow/20261018_0038.jpeg" alt="Photograph 20261018_0038">
            </figure>
            <figure class="slide">
              <img src="../photos/first-slideshow/20261018_0042.jpeg" alt="Photograph 20261018_0042">
            </figure>
            <figure class="slide">
              <img src="../photos/first-slideshow/DSCF0165.jpeg" alt="Photograph DSCF0165">
            </figure>
            <figure class="slide">
              <img src="../photos/first-slideshow/IMG_1033.jpeg" alt="Photograph IMG_1033">
            </figure>
            <figure class="slide">
              <img src="../photos/first-slideshow/IMG_1038.jpeg" alt="Photograph IMG_1038">
            </figure>
            <figure class="slide">
              <img src="../photos/first-slideshow/IMG_1050.jpeg" alt="Photograph IMG_1050">
            </figure>
          </div>
          <div class="slideshow-controls">
            <button class="slide-arrow" type="button" data-previous aria-label="Previous photo">←</button>
            <div class="slide-pagination" data-pagination role="group" aria-label="Choose a photo"></div>
            <button class="slide-arrow" type="button" data-next aria-label="Next photo">→</button>
          </div>
          <p class="slide-status" data-status aria-live="polite"></p>
        </div>
        <div class="empty-state">
          <span class="empty-mark" aria-hidden="true">✳</span>
          <p>Your first photo story starts here.</p>
          <p class="empty-hint">Add photos to <code>site/photos/first-slideshow/</code>, then add one slide per photo to this page.</p>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <span>Made to remember.</span>
      <span>© <span id="year">2026</span></span>
    </footer>
  </body>
</html>
